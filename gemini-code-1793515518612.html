<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITALCHAT - SwahiliConnect Digital</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: #121829;
            --card-hover: #1e2640;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, var(--card-bg), #1a233a);
            padding: 20px;
            border-radius: 16px;
            flex: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-card h3 { margin: 0; color: var(--text-gray); font-size: 13px; letter-spacing: 1px; }
        .stat-card .value { font-size: 26px; font-weight: bold; margin: 10px 0; color: var(--text-white); }
        .withdraw-btn {
            background: linear-gradient(135deg, #f97316, #c2410c);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .banner {
            background: linear-gradient(90deg, #1e3a8a, #1e1b4b);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        h2 { font-size: 18px; margin-bottom: 15px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: transform 0.2s;
        }
        .card:hover { background: var(--card-hover); }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background-color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            position: relative;
            font-size: 18px;
        }
        .online-dot {
            width: 12px;
            height: 12px;
            background-color: var(--accent-green);
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid var(--bg-dark);
        }
        .info-row {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }
        .rate {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-green);
            margin: 12px 0;
        }
        .start-btn {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start-btn:hover { background-color: #2563eb; }
        
        /* Modal ya Chat inayoendana na picha uliyotuma */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #111827;
            width: 100%;
            max-width: 450px;
            height: 600px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .chat-header {
            padding: 15px 20px;
            background: #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .chat-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b0f19;
        }
        .message {
            background: #1f2937;
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 75%;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.user {
            background: var(--accent-blue);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .message.guest {
            background: #374151;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 15px 20px;
            background: #1f2937;
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: none;
            background: #111827;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .chat-input-area button {
            background: var(--accent-blue);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .close-modal { background: none; border: none; color: var(--text-gray); font-size: 22px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="stat-card">
            <h3>NET PROFIT</h3>
            <div class="value" id="netProfit">TZS 0</div>
        </div>
        <div class="stat-card">
            <h3>BALANCE</h3>
            <div class="value" id="balance">TZS 0</div>
            <button class="withdraw-btn" onclick="withdrawMoney()">Toa Pesa</button>
        </div>
    </header>

    <div class="banner">
        CHAGUA WA KUCHAT NAYE: Wageni waliopo online hivi sasa. Pata hela kwa kila dakika unayochat nao.
    </div>

    <h2>Wageni waliopo online</h2>
    <div class="grid" id="guestGrid"></div>

    <!-- Modal ya Dirisha la Chat -->
    <div class="modal" id="chatModal">
        <div class="modal-content">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="avatar" id="modalAvatar" style="width: 35px; height: 35px; font-size: 14px;">E<div class="online-dot"></div></div>
                    <div>
                        <div id="chatGuestName" style="font-weight: bold; font-size: 14px;">Emma</div>
                        <div style="font-size: 11px; color: var(--accent-green);">Online • <span id="chatTimer">01:00</span></div>
                    </div>
                </div>
                <button class="close-modal" onclick="closeChat()">×</button>
            </div>
            <div class="chat-messages" id="chatMessages">
                <!-- Ujumbe utaingia hapa hapa -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Andika ujumbe..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const guests = [
            { name: "Emma", topic: "Safari & Wildlife", rate: "TZS 37,700", time: "24 minutes", rating: "4.9 ★" },
            { name: "Alexander", topic: "Tanzanian Food", rate: "TZS 35,880", time: "34 minutes", rating: "4.7 ★" },
            { name: "David K.", topic: "Transport & Directions", rate: "TZS 33,280", time: "23 minutes", rating: "4.6 ★" },
            { name: "Omar K.", topic: "Trade & Markets", rate: "TZS 36,000", time: "18 minutes", rating: "4.8 ★" },
            { name: "Maria C.", topic: "Bongo Flava Music", rate: "TZS 38,100", time: "29 minutes", rating: "4.9 ★" },
            { name: "Hans P.", topic: "Zanzibar Beaches", rate: "TZS 39,200", time: "41 minutes", rating: "5.0 ★" },
            { name: "Lucas M.", topic: "Business & Startup", rate: "TZS 31,500", time: "15 minutes", rating: "4.5 ★" },
            { name: "Oliver H.", topic: "Family & Home", rate: "TZS 40,300", time: "32 minutes", rating: "4.8 ★" },
            { name: "Asha M.", topic: "Swahili & Culture", rate: "TZS 34,400", time: "21 minutes", rating: "4.7 ★" },
            { name: "Sophia L.", topic: "Fashion & Art", rate: "TZS 32,900", time: "19 minutes", rating: "4.4 ★" },
            { name: "Hassan B.", topic: "History & Tours", rate: "TZS 35,000", time: "26 minutes", rating: "4.9 ★" },
            { name: "Daniel M.", topic: "Tech & Coding", rate: "TZS 36,500", time: "25 minutes", rating: "4.8 ★" }
        ];

        let netProfit = 0;
        let balance = 0;
        let chatInterval = null;
        let currentGuest = "";

        const grid = document.getElementById('guestGrid');
        guests.forEach((g) => {
            grid.innerHTML += `
                <div class="card">
                    <div class="profile-header">
                        <div class="avatar">${g.name[0]}<div class="online-dot"></div></div>
                        <div>
                            <div style="font-weight: bold; font-size: 15px;">${g.name}</div>
                            <div style="font-size: 12px; color: var(--text-gray);">${g.rating}</div>
                        </div>
                    </div>
                    <div class="info-row"><span>Mada:</span> <strong>${g.topic}</strong></div>
                    <div class="info-row"><span>Muda:</span> <strong>${g.time}</strong></div>
                    <div class="rate">${g.rate}</div>
                    <button class="start-btn" onclick="startChat('${g.name}')">START CHAT</button>
                </div>
            `;
        });

        function startChat(name) {
            currentGuest = name;
            document.getElementById('chatGuestName').innerText = name;
            document.getElementById('modalAvatar').innerText = name[0];
            document.getElementById('chatModal').style.display = 'flex';
            
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.innerHTML = `
                <div class="message guest">Habari! Mimi ni ${name}. Niko tayari kushirikiana nawe.</div>
                <div class="message guest">Nimefurahi sana kuona umeanza kuchat nami ndani ya dakika hii ya kwanza! Malipo yako yanaanza kuingia sasa hivi.</div>
            `;
            
            // Anza kuhesabu malipo na muda papo hapo ndani ya sekunde chache / dakika ya kwanza
            let secondsLeft = 60;
            clearInterval(chatInterval);
            chatInterval = setInterval(() => {
                secondsLeft--;
                let m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
                let s = (secondsLeft % 60).toString().padStart(2, '0');
                document.getElementById('chatTimer').innerText = `${m}:${s}`;

                // Ongeza Net Profit na Balance moja kwa moja ndani ya dakika ya kwanza
                netProfit += 600;
                balance += 600;
                document.getElementById('netProfit').innerText = "TZS " + netProfit.toLocaleString();
                document.getElementById('balance').innerText = "TZS " + balance.toLocaleString();

                if(secondsLeft <= 0) {
                    secondsLeft = 60; // Hurudisha muda uendelee
                }
            }, 1000);
        }

        function closeChat() {
            document.getElementById('chatModal').style.display = 'none';
            clearInterval(chatInterval);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(text !== "") {
                const messagesContainer = document.getElementById('chatMessages');
                messagesContainer.innerHTML += `<div class="message user">${text}</div>`;
                input.value = "";
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // Jibu la kiotomatiki kutoka kwa mgeni baada ya sekunde 1
                setTimeout(() => {
                    messagesContainer.innerHTML += `<div class="message guest">${currentGuest}: Nimekupata vizuri sana! Endelea kuandika...</div>`;
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 1000);
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function withdrawMoney() {
            if(balance > 0) {
                alert("Ombi la kutoa kiasi cha TZS " + balance.toLocaleString() + " limefanikiwa!");
                balance = 0;
                document.getElementById('balance').innerText = "TZS 0";
            } else {
                alert("Salio lako ni TZS 0. Anza kuchat na wageni ili uongeze faida kwenye dashboard yako!");
            }
        }
    </script>
</body>
</html>
